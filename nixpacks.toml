# Railway / Nixpacks build configuration.
#
# THE ACTUAL FIX IS IN package.json, NOT HERE.
#
# History, so nobody re-breaks this:
#
#   1. NODE_ENV=production makes npm install with --omit=dev.
#   2. The Nest CLI and the TypeScript compiler were devDependencies.
#   3. So they weren't installed, `nest build` had no compiler, `dist/` was
#      never produced, and the container died with:
#         Error: Cannot find module '/app/dist/main'
#   4. The first attempt at a fix was this file, forcing `--include=dev`.
#      Railway ignored it and kept using its own install command — the deploy
#      log still showed `npm warn config production Use --omit=dev instead`.
#
# So the build tools were moved into `dependencies` in package.json instead.
# They are then installed no matter what flags the platform chooses, which
# means the build works on Railway, Render, Fly, Docker or a laptop without
# any platform-specific configuration at all. Verified by running
# `npm ci --omit=dev` and confirming the compiler is still present.
#
# This file now only pins the phases explicitly. If Railway honours it, good;
# if it ignores it (as it did before), the build still works.

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
